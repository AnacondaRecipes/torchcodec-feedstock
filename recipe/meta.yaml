{% set name = "torchcodec" %}
{% set version = "0.17.0" %}
{% set build_num = 0 %}

{% if gpu_variant == "cuda" %}
{% set build_num = 100 + build_num %}
{% endif %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/meta-pytorch/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 095b45702643875516d79c20005bdd05fb998368b4e4cd63e97e01e133c8a34d
    patches:
      # Upstream downloads a prebuilt libavif from S3 and compiles a vendored giflib;
      # link the channel's libavif and giflib instead.
      - patches/use_system_libavif.patch
      - patches/use_system_giflib.patch
      - patches/use_correct_python_on_windows.patch # [win]
      # Backport of upstream #1803 (fixes #1802): CUDA batch decode corrupts images on the nvJPEG software path.
      - patches/fix_nvjpeg_software_batch_race.patch
  # Binary test asset added by upstream #1803, which the text patch above cannot carry.
  - url: https://raw.githubusercontent.com/meta-pytorch/{{ name }}/70fe2a64dfa4bd9708bb8da4e79f43742c9ae37d/test/resources/gradient_progressive.jpg
    sha256: e9befb1fae5ed64b03e47590d48ff54e859d4d34413db0b52325bdff1df09b38
    folder: test/resources

build:
  number: {{ build_num }}
  # pytorch 2.15 requires python >=3.11 (no py3.10 builds); torchcodec itself allows >=3.10.
  # Upstream documents support up to 3.14 (README); 3.15 is validated only by this CI.
  skip: true  # [py<311 or py>315]
  # zlib is only needed by FindPNG at configure time; libtorchcodec does not link it.
  ignore_run_exports_from:
    - zlib
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build_num }} # [gpu_variant == "cpu"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build_num }} # [gpu_variant == "cuda"]
  missing_dso_whitelist:
    - "$RPATH/libtorchcodec_core8.so"    # [linux]
    - "$RPATH/libtorchcodec_core8.dll"   # [win]
    - "$RPATH/libtorchcodec_core8.dylib" # [osx]
requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cuda') }} # [gpu_variant=="cuda"]
    - cmake
    - pkg-config
    - ninja-base
  host:
    - python
    - pip
    - scikit-build-core >=0.10
    - ffmpeg {{ ffmpeg }}
    - libtorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
    - libtorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
    - pytorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
    - pytorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
    # Matches the pytorch-feedstock 2.15 pybind11 pin (no aggregate CBC key).
    - pybind11 >=3.0.4,<4
    - pybind11-abi
    # Image decoders (JPEG, PNG, WebP, AVIF, GIF). HEIC is disabled in the build
    # scripts because libheif is not available on the channel.
    - libjpeg-turbo {{ libjpeg_turbo }}
    - libpng {{ libpng }}
    - zlib {{ zlib }}
    - libwebp-base {{ libwebp_base }}
    - libavif {{ libavif }}
    - giflib {{ giflib }}
    # These are dev packages (headers etc.) for transitive dependencies of libtorch
    - cuda-version =={{ cuda_compiler_version }} # [gpu_variant == "cuda"]
    - cuda-driver-dev     # [gpu_variant == "cuda" and linux]
    - nccl                # [gpu_variant == "cuda" and linux]
    - cuda-cudart-dev     # [gpu_variant == "cuda"]
    - cuda-nvrtc-dev      # [gpu_variant == "cuda"]
    - cuda-nvtx-dev       # [gpu_variant == "cuda"]
    - cuda-nvml-dev       # [gpu_variant == "cuda"]
    - cuda-profiler-api   # [gpu_variant == "cuda"]
    - libcublas-dev       # [gpu_variant == "cuda"]
    - libcufft-dev        # [gpu_variant == "cuda"]
    - libcurand-dev       # [gpu_variant == "cuda"]
    - libcusolver-dev     # [gpu_variant == "cuda"]
    - libcusparse-dev     # [gpu_variant == "cuda"]
    - nvtx-c              # [gpu_variant == "cuda"]
    # These are actual torchcodec deps
    - libnvjpeg-dev       # [gpu_variant == "cuda"]

  run:
    - python
    - pytorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
    - pytorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
    - __cuda                         # [gpu_variant=="cuda"]

{% set tests = "test" %}

{% set tests_to_ignore = "" %}
# The third party tests perform builds using cmake. The cmake script that finds CUDA is old and not
# easily compatible with conda installations.
{% set tests_to_ignore = tests_to_ignore + " --deselect test/third-party-interface/test_third_party_interface.py" %}
# Many of the video decoding and encoding tests require a GPL build of ffmpeg to suport x264 and x265
# codecs. However, that is not available on the main channel, so disable the encoder/decoder tests.
{% set tests_to_ignore = tests_to_ignore + " --deselect test/test_encoders.py::TestEncoder" %}
{% set tests_to_ignore = tests_to_ignore + " --deselect test/test_encoders.py::TestVideoEncoder" %}
{% set tests_to_ignore = tests_to_ignore + " --deselect test/smoke_test.py::TestVideoDecoder" %}
# These write their input video first without libx264: the [cpu] case falls back to mpeg4, which
# rejects yuv444p; the [cuda] case encodes yuv420p and then fails its closeness check.
{% set tests_to_ignore = tests_to_ignore + " --deselect test/smoke_test.py::TestLowLevelAPIs::test_video_seek" %}
{% set tests_to_ignore = tests_to_ignore + " --deselect test/smoke_test.py::TestLowLevelAPIs::test_multi_stream" %}
# Streams libx264 into a fifo; without the encoder the reader blocks until the task times out.
{% set tests_to_ignore = tests_to_ignore + " --deselect test/test_decoders.py::TestLowLevel::test_seek_on_non_seekable_source_raises" %}  # [unix]

# requires CUDA enabled ffmpeg, which we don't currently have on main
{% set tests_to_ignore = tests_to_ignore + " --deselect test/smoke_test.py::TestEncoder::test_cuda_encoding" %}

# the video decoder tests require a CUDA enabled version of ffmpeg, which we do not (yet?)
# have on the main channel
{% set tests_to_ignore = tests_to_ignore + " --deselect test/test_decoders.py::TestVideoDecoder" %} # [gpu_variant=="cuda"]

{% set skip_tests = "test_video_and_audio_chunked" %}
{% set skip_tests = skip_tests + " or test_roundtrip_lossless" %}
# cuda+ffmpeg tests require a cuda-enabled ffpmeg, which we don't have on main
{% set skip_tests = skip_tests + " or (cuda and ffmpeg)" %}

# We can't run CUDA tests on aarch64 due to platform limitations. The GPU arch is sm_75, but pytorch only supports >sm_80
{% set skip_tests = skip_tests + " or cuda" %} # [aarch64]

test:
  source_files:
    - test/
  requires:
    - pytest
    - numpy
    - pillow
    - torchvision
    - pip
    # TEMPORARY, remove with the abs.yaml channel: pkgs/main libavif 1.4.2 build 0 has no AV1
    # codec; force build 1 (libavif-feedstock#8) over it in the test env.
    - libavif >=1.4.2 *_1
  imports:
    - torchcodec
  commands:
    - pip check
    # Fail instead of skipping when an image codec we build is missing (HEIC is not built).
    - export FAIL_WITHOUT_IMAGE_CODECS=1 FAIL_WITHOUT_HEIC=0  # [unix]
    - set FAIL_WITHOUT_IMAGE_CODECS=1  # [win]
    - set FAIL_WITHOUT_HEIC=0  # [win]
    - pytest {{ tests }} -v -s  --durations=50 {{ tests_to_ignore }} -k "not ({{skip_tests}})"

about:
  home: https://github.com/meta-pytorch/torchcodec
  # MIT: the NVIDIA Video Codec SDK headers shipped under _core/nvcuvid_include.
  license: BSD-3-Clause AND MIT
  license_file:
    - LICENSE
    - src/torchcodec/_core/nvcuvid_include/nvcuvid.h
    - src/torchcodec/_core/nvcuvid_include/cuviddec.h
  license_family: Other
  summary: TorchCodec is a Python library for decoding videos into PyTorch tensors, on CPU and CUDA GPU.
  description: |
    TorchCodec is a Python library for decoding video and audio data into PyTorch
    tensors, on CPU and CUDA GPU. It also supports video and audio encoding on
    CPU! It aims to be fast, easy to use, and well integrated into the PyTorch
    ecosystem. If you want to use PyTorch to train ML models on videos and audio,
    or run inference, TorchCodec is how you turn these into data.
  dev_url: https://github.com/meta-pytorch/torchcodec
  doc_url: https://meta-pytorch.org/torchcodec/stable/index.html

extra:
  recipe-maintainers:
    - traversaro
    - Dan-Flores
  feedstock-name: torchcodec
