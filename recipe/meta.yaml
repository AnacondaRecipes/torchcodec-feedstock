{% set name = "torchcodec" %}
{% set version = "0.14.0" %}
{% set build_num = 0 %}

  # torch_proc_type: ${{ "cuda" ~ cuda_compiler_version | version_to_buildstring if cuda_compiler_version != "None" else "cpu" }}
  # # ensure arm_variant_type gets detected as a used variable
  # touch_arm_variant_type: ${{ arm_variant_type | default("None") }}

package:
  name: torchcodec-split
  version: {{ version }}

source:
  - url: https://github.com/meta-pytorch/torchcodec/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 340d85964f4865b16831b14923e3608866afbe6d5253b46a7c496bcdfb70bffa
    patches:
      - patches/fix_third_party_interface_library_loading.patch
      - patches/use_correct_python_on_windows.patch # [win]

build:
  number: {{ build_num }}
  skip: true # [ py<310 or osx or ((gpu_variant == "cpu" or aarch64) and (cuda_compiler_version or "12").startswith("12"))]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build_num }} # [gpu_variant == "cpu"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build_num }} # [gpu_variant == "cuda"]

outputs:
  - name: torchcodec
    version: {{ version }}
    build: 
      number: {{ build_num }}
      missing_dso_whitelist:
        - "$RPATH/libtorchcodec_core8.so"
    script: build_torchcodec.sh # [unix]
    script: build_torchcodec.bat # [win]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cuda') }} # [gpu_variant=="cuda"]
        # - if: cuda_compiler_version != "None" and linux and aarch64
        #   then:
        #     - arm-variant * ${{ arm_variant_type | default("None") }}
        - cmake
        - pkg-config
        - ninja

      host:
        - python
        - pip
        - setuptools
        - ffmpeg
        - libtorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
        - libtorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
        - pytorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
        - pytorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
        # We temporary relatex the pytorch dependency on to be compatible with torchvision,
        # see https://github.com/conda-forge/torchcodec-feedstock/pull/69#issuecomment-4751807811
        # - if: cuda_compiler_version == "12.9" and win
        #   then:
        #     - libtorch * [build=cuda12*]
        #     - pytorch * [build=cuda12*]
        #   else:
        #     - libtorch * [build=${{ torch_proc_type }}*]
        #     - pytorch * [build=${{ torch_proc_type }}*]
        - pybind11
        # These are dev packages (headers etc.) for transitive dependencies of libtorch
        - cuda-version =={{ cuda_compiler_version }}
        - cuda-driver-dev     # [gpu_variant == "cuda" and linux]
        - nccl                # [gpu_variant == "cuda" and linux]
        - cuda-cudart-dev     # [gpu_variant == "cuda"]
        - cuda-nvrtc-dev      # [gpu_variant == "cuda"]
        - cuda-nvtx-dev       # [gpu_variant == "cuda"]
        - cuda-nvml-dev       # [gpu_variant == "cuda"]
        - cuda-profiler-api   # [gpu_variant == "cuda"]
        - libcublas-dev       # [gpu_variant == "cuda"]
        - libcufft-dev        # [gpu_variant == "cuda"]
        - libcurand-dev       # [gpu_variant == "cuda"]
        - libcusolver-dev     # [gpu_variant == "cuda"]
        - libcusparse-dev     # [gpu_variant == "cuda"]
        #- libmagma-devel      # [gpu_variant == "cuda"]
        - nvtx-c              # [gpu_variant == "cuda"]
        # These are actual torchcodec deps
        - libnpp-dev          # [gpu_variant == "cuda"]
            
      run:
        - python
        # We temporary relatex the pytorch dependency on to be compatible with torchvision,
        # see https://github.com/conda-forge/torchcodec-feedstock/pull/69#issuecomment-4751807811
        - pytorch {{ pytorch }}=*cpu*    # [gpu_variant=="cpu"]
        - pytorch {{ pytorch }}=*cuda*   # [gpu_variant=="cuda"]
        - __cuda                         # [gpu_variant=="cuda"]

    {% set tests = "test/test_version.py" %}
    {% set tests = tests + " test/test_frame_dataclasses.py" %}
    {% set tests = tests + " test/test_metadata.py" %}
    {% set tests = tests + " test/test_decoders.py" %}

    {% set tests_to_skip = "" %}
    {% set tests_to_skip = "--deselect test/third-party-interface/test_third_party_interface.py" %}                                         # [win or osx]
    {% set tests_to_skip =  tests_to_skip + " --deselect test/test_encoders.py::TestAudioEncoder::test_against_cli" %}                      # [win]
    {% set tests_to_skip =  tests_to_skip + " --deselect test/test_encoders.py::TestVideoEncoder::test_video_encoder_against_ffmpeg_cli" %} # [win]

    test:
      source_files:
        - test/
      requires:
        - pytest
        - numpy
        - pillow
        - torchvision
        - pip
      imports:
        - torchcodec
      commands:
        - pip check
        - pytest {{ tests }} -v -s  --durations=50 {{ tests_to_skip }}

about:
  homepage: https://github.com/meta-pytorch/torchcodec
  license: BSD-3-Clause
  license_file:
    - LICENSE
  summary: TorchCodec is a Python library for decoding videos into PyTorch tensors, on CPU and CUDA GPU.

extra:
  recipe-maintainers:
    - traversaro
    - Dan-Flores
  feedstock-name: torchcodec
